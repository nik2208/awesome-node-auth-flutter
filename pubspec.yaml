name: awesome_node_auth_flutter
description: >-
  A Flutter/Dart authentication client for the awesome-node-auth backend.
  Supports web (including WASM) via cookie + CSRF and native platforms via
  Bearer token.
version: 1.9.1
homepage: https://github.com/nik2208/awesome-node-auth-flutter
repository: https://github.com/nik2208/awesome-node-auth-flutter
issue_tracker: https://github.com/nik2208/awesome-node-auth-flutter/issues
documentation: https://pub.dev/documentation/awesome_node_auth_flutter/latest/

topics:
  - authentication
  - auth
  - flutter
  - wasm

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  lints: ^6.1.0
